# Disposable Grimoire instance for local development.
#
#   mkdir -p docker/data                                        # before the first start
#   cp docker/users.json.example docker/data/users.json          # repo-root-relative
#   cd docker && docker compose up -d --wait
#   curl -sf http://localhost:9481/api/health
#
# From inside the devcontainer the published port lives on the host, so reach it
# at http://host.docker.internal:9481 rather than localhost.
#
# First-run users come from /data/users.json, which Grimoire seeds at startup and
# then renames to users.json.imported (backend/seed_users.py). That rename is
# unguarded and startup has no except around it, so users.json must sit INSIDE a
# mounted directory — bind-mounting it as a single file makes the rename fail and
# the container will not start. Fixture logins are admin/admin, gm/gm,
# player/player: throwaway credentials for a throwaway stack with a fixed dev
# SECRET_KEY, never for a real deployment.
#
# Reset the instance:  docker compose down && rm -rf data
#
# The library is a bind mount so fixtures can be dropped in and picked up with
# POST /api/rescan. Grimoire mounts it read-only.
#
# IMPORTANT under docker-outside-of-docker: the daemon runs on the HOST, so bind
# mount paths resolve against the HOST filesystem, not the container's.
# `./library` and `./data` therefore do not work from inside the devcontainer —
# set GRIMOIRE_LIBRARY, GRIMOIRE_DATA and GRIMOIRE_ADDON_INDEX to the repo's
# path as the host sees it. Put them in docker/.env (gitignored); see
# docker/env.example.
services:
  grimoire:
    # `nightly` is where the 1.6.0 RC lands, and this rides it deliberately
    # unpinned: the RC is not expected to move much, the window closes when 1.6.0
    # tags, and that release needs a regeneration anyway. Pinning a digest would
    # buy reproducibility we would pay for in repin ceremony and in the risk of
    # silently testing a stale RC.
    #
    # So the spec can drift under the committed client between regenerations. A
    # request shape changing upstream shows up as a smoke-test failure; the answer
    # is to regenerate and read the diff, not to chase it.
    #
    # It reports its version as the literal "nightly" (APP_VERSION is set to the
    # channel name at build time), which carries no number to compare — see
    # IsComparableVersion in GrimoireApiClient. The commit is recoverable without
    # running anything, unlike on `edge`, which carried no labels at all:
    #
    #   docker image inspect hunterreadca/grimoire:nightly \
    #     --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
    #
    # **When 1.6.0 releases this becomes a release tag** (hunterreadca/grimoire:1.6.0)
    # and stays pinned, with version bumps made deliberately from then on. Support
    # for released 1.5.6 lives on support/grimoire-1.5.6, where this file pins the
    # 1.5.6 tag.
    image: hunterreadca/grimoire:nightly
    ports:
      - "9481:9481"
    environment:
      # Disposable stack — a fixed key keeps sessions valid across restarts.
      - SECRET_KEY=dev-only-not-a-real-secret
      - LIBRARY_PATH=/library
      - DATA_PATH=/data
      - WORKERS=1
      - TZ=Europe/Berlin
      - LOG_LEVEL=debug
      # OCR off: this stack is for exercising the API, not for indexing scans.
      - OCR_ENABLED=false
      # OPDS must stay off — with it on, GET /api/openapi.json returns 500
      # (hunter-read/grimoire#276), and that spec is what the CLI is built from.
      - OPDS_ENABLED=false
      # The smoke test logs in several times; the default is 10/minute.
      - RATE_LIMIT_ENABLED=false
    volumes:
      - ${GRIMOIRE_LIBRARY:-./library}:/library:ro
      - ${GRIMOIRE_DATA:-./data}:/data
    networks:
      - grimoire-cli-dev
    # The image already healthchecks /api/health, but with interval=30s and
    # start_period=30s, which makes `up -d --wait` sit for up to a minute.
    # Poll faster so CI and local starts are quick.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9481/api/health', timeout=4).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  # Serves docker/addon-index/ (fixture manifest + generated index.json) so
  # the smoke test can install a real add-on without depending on the
  # published community index or a third-party host. Fetched by the grimoire
  # container as http://addon-index/index.json — a compose service name the
  # devcontainer itself cannot resolve and does not need to.
  addon-index:
    image: nginx:alpine
    volumes:
      - ${GRIMOIRE_ADDON_INDEX:-./addon-index}:/usr/share/nginx/html:ro
    networks:
      - grimoire-cli-dev

# Named explicitly because the default would be derived from this file's parent
# directory: every project whose compose file lives in docker/ would share one
# `docker_default` bridge, and a stack from another repo would then sit on the
# same network as this one. abs-cli names its network for the same reason.
networks:
  grimoire-cli-dev:
    name: grimoire-cli-dev
