# Disposable Grimoire instance for local development.
#
#   cd docker && docker compose up -d
#   curl -sf http://localhost:9481/api/health
#
# From inside the devcontainer, localhost is the container — resolve the
# stack's IP instead:
#   docker inspect docker-grimoire-1 -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}'
#
# The library is a bind mount so fixtures can be dropped in and picked up with
# POST /api/rescan. Grimoire mounts it read-only: it has no upload API and
# never writes to the library.
#
# IMPORTANT under docker-outside-of-docker: the daemon runs on the HOST, so a
# bind mount path is resolved against the HOST filesystem, not the container's.
# `./library` therefore does not work from inside the devcontainer — set
# GRIMOIRE_LIBRARY to the repo's path as the host sees it:
#
#   GRIMOIRE_LIBRARY=$HOME/Development/grimoire-cli/docker/library docker compose up -d
#
# Put it in docker/.env (gitignored) to avoid retyping it.
services:
  grimoire:
    image: hunterreadca/grimoire:latest
    ports:
      - "9481:9481"
    environment:
      # Disposable stack — a fixed key keeps sessions valid across restarts.
      - SECRET_KEY=dev-only-not-a-real-secret
      - LIBRARY_PATH=/library
      - DATA_PATH=/data
      - WORKERS=1
      - TZ=Europe/Berlin
      - LOG_LEVEL=debug
      # OCR off: this stack is for exercising the API, not for indexing scans.
      - OCR_ENABLED=false
      # OPDS must stay off — with it on, GET /api/openapi.json returns 500
      # (hunter-read/grimoire#276), and that spec is what the CLI is built from.
      - OPDS_ENABLED=false
    volumes:
      - ${GRIMOIRE_LIBRARY:-./library}:/library:ro
      - grimoire-data:/data

volumes:
  grimoire-data:
