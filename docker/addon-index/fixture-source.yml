# Minimal valid add-on for the smoke test. AddonManifest is strict (extra keys
# are rejected), and needs_a_backend (backend/addons/manifest.py in v1.5.6)
# requires a 'source' or 'script' block even though this one is never run —
# install, update, upgrade and uninstall never consult a source, so this is
# the smallest source+search pair that satisfies validation without doing
# anything. The metadata-lookup work is what exercises source/search/map.
id: fixture-source
name: Fixture Source
version: 1.0.0
kind: scraper
target: game-system
description: Local fixture for the grimoire-cli smoke test.
source:
  url: https://example.test/fixture-source-index.json
  format: json
search:
  fields:
    - field: name
