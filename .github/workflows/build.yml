name: Build and Test

on:
  pull_request:
    branches: [main]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check formatting
        run: dotnet format GrimoireCli.sln --verify-no-changes
      - name: Run unit tests
        run: dotnet test tests/GrimoireCli.Tests/GrimoireCli.Tests.csproj

  smoke-test:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build AOT binary
        run: >
          dotnet publish src/GrimoireCli/GrimoireCli.csproj
          -c Release -r linux-x64 --self-contained true /p:PublishAot=true
          -o ./publish
      # Grimoire seeds its first users from /data/users.json at startup, so the
      # fixture has to be in place before the container boots. A `services:`
      # container starts before actions/checkout runs and could never see it,
      # which is why the stack comes up here instead.
      - name: Start Grimoire
        run: |
          mkdir -p docker/data
          cp docker/users.json.example docker/data/users.json
          docker compose -f docker/docker-compose.yml up -d --wait
      - name: Run smoke test against the AOT binary
        run: bash docker/smoke-test.sh
        env:
          GRIMOIRE_SERVER: http://localhost:9481
          CLI: ./publish/grimoire-cli
      - name: Grimoire logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs

  build:
    needs: unit-test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native AOT requires matching host arch on Linux/Windows.
          # macOS supports arm64↔x64 cross-compilation via Xcode toolchain.
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: >
          dotnet publish src/GrimoireCli/GrimoireCli.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true /p:PublishAot=true
      - name: Run self-test (AOT integrity check)
        shell: bash
        run: |
          BIN="src/GrimoireCli/bin/Release/net10.0/${{ matrix.rid }}/publish/grimoire-cli"
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          "${BIN}" self-test
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: grimoire-cli-${{ matrix.rid }}
          path: src/GrimoireCli/bin/Release/net10.0/${{ matrix.rid }}/publish/
          retention-days: 5
      - name: Attach binary to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BIN="src/GrimoireCli/bin/Release/net10.0/${{ matrix.rid }}/publish/grimoire-cli"
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          EXT=""
          [[ "$BIN" == *.exe ]] && EXT=".exe"
          cp "$BIN" "grimoire-cli-${{ matrix.rid }}${EXT}"
          gh release upload "${{ github.event.release.tag_name }}" "grimoire-cli-${{ matrix.rid }}${EXT}"
